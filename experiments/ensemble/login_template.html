<title>SMP Forecast</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; color: #0d3b66;
  background: linear-gradient(180deg, rgba(255,255,255,0) 50%, rgba(255,255,255,0.45) 100%),
              linear-gradient(90deg, #ffe7c2 0%, #a9dcf6 24%, #6ec0f0 50%, #9dc9ee 74%, #f6c39b 100%); overflow: hidden; }
/* 해·송전탑 — 대시보드 머리 띠와 같은 그림 (해: 왼쪽 위, 송전탑: 오른쪽 아래) */
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sun { position: absolute; left: 0; top: 16px; width: 220px; height: 193px; overflow: visible; }
.sun-rays { stroke: #ffd166; stroke-width: 4; stroke-linecap: round; opacity: 0.75; }
.sun-glow { animation: glow 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes glow { from { opacity: 0.75; transform: scale(0.96); } to { opacity: 1; transform: scale(1.04); } }
.towers { position: absolute; right: 0; bottom: 0; width: min(560px, 62vw); height: auto; }
.tower { fill: none; stroke: #25456b; stroke-width: 1.8; stroke-linejoin: round; opacity: 0.6; }
.wires { fill: none; stroke: #25456b; stroke-width: 1.2; opacity: 0.45; }
@media (prefers-reduced-motion: reduce) { .sun-glow { animation: none; } }
@media (max-width: 600px) { .sun { width: 150px; height: 132px; } .towers { opacity: 0.55; } }

main { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.gate { width: 100%; max-width: 380px; text-align: center; background: rgba(255,255,255,0.86); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.95); border-radius: 20px; padding: 30px 26px 26px; box-shadow: 0 0 2px rgba(13,59,102,0.10), 0 0 32px rgba(13,59,102,0.14); }
h1 { font-size: 28px; font-weight: 750; margin: 0 0 6px; letter-spacing: -0.02em; line-height: 1.2; }
.lead { margin: 0 0 18px; color: #3d5a78; font-size: 13.5px; }
label { display: block; text-align: left; font-size: 12.5px; font-weight: 600; color: #3d5a78; margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 16px; color: #0b0b0b; background: #fff; border: 1px solid rgba(13,59,102,0.18); border-radius: 12px;
  padding: 11px 14px; letter-spacing: 0.08em; }
input:focus { outline: 2px solid #2a78d6; outline-offset: 1px; }
button { width: 100%; margin-top: 12px; font: inherit; font-weight: 650; font-size: 15px; color: #fff; background: #1f3a6b; border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; box-shadow: 0 0 2px rgba(13,59,102,0.2), 0 0 10px rgba(13,59,102,0.18); }
button:hover { background: #18305a; }
button:disabled { opacity: 0.7; cursor: progress; }
.msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: #b42318; }
.msg.busy { color: #3d5a78; }
.foot { margin-top: 14px; font-size: 11.5px; color: #6b7f94; }
</style>

  </svg>
</div>
<main>
  <form class="gate" id="gate" autocomplete="off">
    <h1>SMP Forecast</h1>
    <p class="lead">비밀번호를 입력하면 대시보드가 열립니다</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" id="go">들어가기</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="foot">교육·연구 목적 · 팀 내부 공유 전용</div>
  </form>
</main>
<script>
// 대시보드 HTML 을 비밀번호로 암호화한 값 (PBKDF2-SHA256 → AES-256-GCM). 비밀번호가 맞을 때만 브라우저 안에서 풀림
const P = /*__PAYLOAD__*/null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
                                            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(plain);
}
const msg = document.getElementById("msg"), go = document.getElementById("go"), pw = document.getElementById("pw");
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  go.disabled = true; msg.className = "msg busy"; msg.textContent = "여는 중…";
  try {
    const html = await unlock(pw.value);
    document.open(); document.write(html); document.close();      // 대시보드로 바꿔 그림
  } catch (err) {
    go.disabled = false; msg.className = "msg"; msg.textContent = "비밀번호가 맞지 않습니다";
    pw.select();
  }
});
</script>
